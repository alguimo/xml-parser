name: Windows build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp build version
        id: meta
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = "1.0.$($env:RUN_NUMBER)"
          $tag = "v$version"

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $versionFile = Join-Path $PWD "app/version.py"
          $content = [System.IO.File]::ReadAllText($versionFile, $utf8NoBom)
          $updated = $content.Replace('APP_VERSION = "1.0.0"', "APP_VERSION = `"$version`"")
          [System.IO.File]::WriteAllText($versionFile, $updated, $utf8NoBom)

          $stamped = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          if ($stamped.Trim() -ne $version) {
            Write-Error "Failed to stamp APP_VERSION: got '$stamped', expected '$version'"
            exit 1
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          beautifulsoup4==4.15.0
          charset-normalizer==3.5.1
          customtkinter==6.0.0
          darkdetect==0.8.0
          lxml==6.1.3
          packaging==26.3
          pillow==12.3.0
          pystray==0.19.5
          reportlab==5.0.1
          six==1.17.0
          soupsieve==2.9.2
          tkinterdnd2==0.6.3
          typing-extensions==4.16.0
          pyinstaller==6.14.1

      - name: Build application bundle with PyInstaller
        run: pyinstaller --clean --noconfirm Convertisseur.spec

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $defaultPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup --no-progress -y
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc "/DMyAppVersion=$($env:APP_VERSION)" "installer\Convertisseur.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $installer = Join-Path $PWD "dist/ConvertisseurWEDA-Setup.exe"
          $checksum = Join-Path $PWD "dist/ConvertisseurWEDA-Setup.exe.sha256"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText($checksum, "$hash  ConvertisseurWEDA-Setup.exe`n", $utf8NoBom)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertisseur-WEDA-windows-installer
          path: |
            dist/ConvertisseurWEDA-Setup.exe
            dist/ConvertisseurWEDA-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $installer = "dist/ConvertisseurWEDA-Setup.exe"
          $checksum = "dist/ConvertisseurWEDA-Setup.exe.sha256"
          gh release view "$env:RELEASE_TAG" >$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$installer" "$checksum" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$installer" "$checksum" `
              --target "$env:TARGET_SHA" `
              --title "Convertisseur WEDA $env:RELEASE_TAG" `
              --latest `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

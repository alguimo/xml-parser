name: Windows build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable (onefile)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          beautifulsoup4==4.15.0
          charset-normalizer==3.5.1
          customtkinter==6.0.0
          darkdetect==0.8.0
          lxml==6.1.3
          packaging==26.3
          pillow==12.3.0
          reportlab==5.0.1
          soupsieve==2.9.2
          tkinterdnd2==0.6.3
          typing-extensions==4.16.0
          pyinstaller==6.14.1

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm Convertisseur.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Convertisseur-WEDA-windows
          path: dist/Convertisseur WEDA.exe
          if-no-files-found: error
          retention-days: 30
